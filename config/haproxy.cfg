# Proxy del socket de Docker: lista blanca por metodo y por ruta.
#
# Solo GET y solo seis rutas, con prefijo de version opcional (/v1.44/...).
# Todo lo demas, 403. Lo que importa que NO pase, aunque sea GET:
#   /containers/{id}/json     devuelve Config.Env: los secretos de TODOS los contenedores
#   /containers/{id}/archive  saca ficheros del contenedor
#   /containers/{id}/export   saca el sistema de ficheros entero
# Lo unico que se concede fuera de GET es POST /containers/<nombre>/restart, y
# solo para los contenedores del asistente, nombrados uno a uno.
# deploy.sh comprueba en cada despliegue que esas rutas y un POST dan 403.

global
    log stdout format raw local0 info
    maxconn 64

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend docker
    bind :2375

    # El id sigue la regla de nombres de Docker: empieza por alfanumerico, asi
    # que ".." no cuela como id.
    acl permitida path_reg ^(/v[0-9.]+)?/(_ping|info|version|containers/json)$
    acl permitida path_reg ^(/v[0-9.]+)?/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/(logs|stats)$

    # Lo unico que se puede escribir: reiniciar los contenedores del propio
    # asistente, con los nombres uno a uno en el propio regex. Sin comodines:
    # ni postgres (se lleva los datos), ni el socket-proxy (es quien concede
    # esto), ni nada de APIArena, que es produccion.
    acl reiniciable path_reg ^(/v[0-9.]+)?/containers/(puente-agent|puente-homelab-mcp|puente-google-mcp|puente-ntfy|puente-redis|puente-litellm)/restart$

    # El healthcheck pega cada 30 s; en el log solo interesa lo demas.
    http-request set-log-level silent if { path /_ping }
    # Un espacio es Y, || es O: (GET y permitida) o (POST y reiniciable).
    http-request deny deny_status 403 unless { method GET } permitida || { method POST } reiniciable

    default_backend socket

backend socket
    server docker /var/run/docker.sock
