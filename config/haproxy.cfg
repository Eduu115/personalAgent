# Proxy del socket de Docker: lista blanca por metodo y por ruta.
#
# Solo GET y solo seis rutas, con prefijo de version opcional (/v1.44/...).
# Todo lo demas, 403. Lo que importa que NO pase, aunque sea GET:
#   /containers/{id}/json     devuelve Config.Env: los secretos de TODOS los contenedores
#   /containers/{id}/archive  saca ficheros del contenedor
#   /containers/{id}/export   saca el sistema de ficheros entero
# Lo unico que se concede fuera de GET es POST /containers/<nombre>/restart, y
# solo para los contenedores del asistente, nombrados uno a uno.
# deploy.sh comprueba en cada despliegue que esas rutas y un POST dan 403.

global
    log stdout format raw local0 info
    maxconn 64

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend docker
    bind :2375

    # Allows explicitos y deny al final. La forma corta, un unico deny con
    # "unless A B || C D", es mucho mas facil de leer mal: en HAProxy las
    # condiciones seguidas se combinan con AND y una alternancia mal puesta
    # deniega todo lo que no sea GET sin que se note.
    acl es_get    method GET
    acl es_post   method POST

    # Solo lectura. El id sigue la regla de nombres de Docker: empieza por
    # alfanumerico, asi que ".." no cuela como id.
    acl lectura   path_reg ^(/v[0-9.]+)?/(_ping|info|version|containers/json)$
    acl lectura   path_reg ^(/v[0-9.]+)?/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/(logs|stats)$

    # Lo unico que escribe: reiniciar los contenedores del propio asistente, con
    # los nombres uno a uno. Ni postgres (se lleva los datos por delante), ni el
    # socket-proxy (es quien concede esto), ni nada de APIArena, que es produccion.
    acl reinicio  path_reg ^(/v[0-9.]+)?/containers/puente-(agent|homelab-mcp|google-mcp|ntfy|redis|litellm)/restart$

    # El healthcheck pega cada 30 s; en el log solo interesa lo demas.
    http-request set-log-level silent if { path /_ping }

    http-request allow if es_get lectura
    http-request allow if es_post reinicio
    http-request deny deny_status 403

    default_backend socket

backend socket
    server docker /var/run/docker.sock
