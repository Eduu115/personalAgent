name: puente

# Regla no negociable de este proyecto: TODO contenedor lleva mem_limit.
# Este host sirve APIArena en produccion. Sin limites, un bucle del agente
# que se hincha hace que el OOM killer del kernel elija victima por heuristica,
# y puede llevarse apiarena-postgres por delante.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    image: postgres:16-alpine
    container_name: puente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-puente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-puente}
    command: >-
      postgres
      -c shared_buffers=256MB
      -c max_connections=40
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-puente} -d ${POSTGRES_DB:-puente}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    memswap_limit: 512m
    networks: [puente]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: puente-redis
    restart: unless-stopped
    # Con contrasena: comparte la red puente con google-mcp, que es lo que parsea
    # el contenido mas hostil del proyecto. Va en el comando y no en un sh -c
    # para no saltarse el entrypoint de la imagen, que baja a usuario redis.
    command: >-
      redis-server
      --save 60 1000
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --requirepass ${REDIS_PASSWORD:?define REDIS_PASSWORD en .env (openssl rand -hex 24)}
    environment:
      # redis-cli la toma de aqui: el healthcheck se autentica sin -a en la linea.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      # Con grep y no por el codigo de salida: un NOAUTH tambien sale con 0.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 96m
    memswap_limit: 96m
    networks: [puente]
    logging: *default-logging

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: puente-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # la cache de respuestas vive en redis
      redis:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?define ANTHROPIC_API_KEY en .env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?define LITELLM_MASTER_KEY en .env}
      # Base propia (db/init/02_litellm_db.sql). Sin ella max_budget no se aplica.
      # connection_limit acota el pool de Prisma, que por defecto es 2*CPU+1 y
      # con 12 hilos agotaria el max_connections=40 de postgres.
      DATABASE_URL: postgresql://${POSTGRES_USER:-puente}:${POSTGRES_PASSWORD}@postgres:5432/litellm?connection_limit=5
      LITELLM_LOG: ${LITELLM_LOG:-ERROR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Solo en localhost del host: nadie llega aqui salvo por el tailnet.
    ports:
      - "127.0.0.1:4141:4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    # Medido (LiteLLM 1.100.1, con DATABASE_URL): ~820 MiB en reposo y pico de
    # ~1,29 GiB al arrancar, mientras Prisma migra. Con 384m moria por OOM antes
    # de terminar de importar. 1536m = pico + ~20%.
    mem_limit: 1536m
    memswap_limit: 1536m
    networks: [puente]
    logging: *default-logging

  agent:
    build:
      context: ./agent
    image: puente/agent:dev
    container_name: puente-agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # started y no healthy: sin un MCP el agente sigue respondiendo, solo que
      # sin sus herramientas. Un MCP roto no tiene que tumbar el chat.
      homelab-mcp:
        condition: service_started
      google-mcp:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-puente}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-puente}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      SMART_MODEL: ${SMART_MODEL:-smart}
      FAST_MODEL: ${FAST_MODEL:-fast}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      READ_ONLY: ${READ_ONLY:-false}
      # Sin dos puntos a proposito: BRIEFING_CRON vacio en .env apaga el briefing.
      BRIEFING_CRON: ${BRIEFING_CRON-30 7 * * *}
      # Vacia: la de por defecto, que esta en config.py con el porque.
      BRIEFING_QUERY: ${BRIEFING_QUERY-}
      NTFY_TOKEN_PUBLICAR: ${NTFY_TOKEN_PUBLICAR}
      # La abren los botones del push de aprobacion desde el movil.
      PUENTE_BASE_URL: ${PUENTE_BASE_URL:-}
      # Identidad del dueno para el prompt. El correo es la MISMA variable con la
      # que google-mcp entra al buzon: una sola fuente, sin copias que divergir.
      DUENO: ${DUENO:-Edu}
      GMAIL_USUARIO: ${GMAIL_USUARIO:-}
      ZONA_HORARIA: ${ZONA_HORARIA:-Europe/Madrid}
    # El puerto que expone tailscale serve. Solo localhost.
    ports:
      - "127.0.0.1:${AGENT_PORT:-8420}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)\""]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    memswap_limit: 512m
    networks: [puente]
    logging: *default-logging

  # ---------------------------------------------------------------- homelab

  # El unico contenedor que ve el socket de Docker. HAProxy con lista blanca por
  # ruta (config/haproxy.cfg): solo GET y solo seis endpoints de lectura, el
  # resto 403. tecnativa no sirve: con CONTAINERS=1 concede tambien
  # /containers/{id}/json, que devuelve las variables de entorno (los secretos)
  # de todos los contenedores, y su filtro no baja a nivel de ruta.
  # Vive en una red interna sin salida, junto al MCP y con nadie mas.
  docker-socket-proxy:
    image: haproxy:3.0-alpine
    container_name: puente-socket-proxy
    restart: unless-stopped
    # Sin root: el usuario haproxy de la imagen (uid 99) abre el socket por el
    # grupo que es su dueno en el host. deploy.sh lo detecta y lo pone en .env.
    group_add:
      - "${DOCKER_GID:?define DOCKER_GID en .env (ver .env.example)}"
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    healthcheck:
      # -O /dev/null y no --spider: el proxy solo deja pasar GET.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 48m
    memswap_limit: 48m
    networks: [lab]
    logging: *default-logging

  homelab-mcp:
    build:
      context: ./homelab-mcp
    image: puente/homelab-mcp:dev
    container_name: puente-homelab-mcp
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    environment:
      DOCKER_API: http://docker-socket-proxy:2375
      HOSTFS: /hostfs
      PROC_PATH: /host/proc
      # Los stacks que lab_update_stack puede actualizar. Vacio: la herramienta
      # ni se registra. Quien manda de verdad es /etc/puente/stacks.conf del
      # host, que el agente no ve.
      STACKS_ACTUALIZABLES: ${STACKS_ACTUALIZABLES:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Solo lectura y sin root: solo alcanza lo que ya es legible por todos.
      # Es el patron de node-exporter. De aqui salen memoria, carga y discos.
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      # El socket del helper del host: la unica via para actualizar un stack
      # (el socket-proxy no puede, ver homelab-mcp/app/helper.py). En desarrollo
      # no existe, se monta /dev/null y da igual porque la herramienta no esta.
      - ${HELPER_SOCKET:-/dev/null}:/run/puente/helper.sock
      - type: bind
        source: /
        target: /hostfs
        read_only: true
        bind:
          # Sin rslave, un bind de / no arrastra los submontajes y statvfs de
          # cualquier particion aparte devolveria los datos de / sin avisar.
          propagation: rslave
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    # El grupo que puede hablar con el helper del host (lo crea su instalador).
    # Por defecto, el grupo propio del usuario del contenedor: no da nada.
    group_add:
      - "${HELPER_GID:-10002}"
    # Publicado en localhost para que Claude Code en el server use el mismo
    # servidor MCP que el agente. Una integracion, dos clientes.
    ports:
      - "127.0.0.1:${MCP_PORT:-8421}:8000"
    healthcheck:
      # Un GET a /mcp sin cabeceras de sesion devuelve 406 por diseno del
      # transporte streamable-http, y urlopen lo lanza como excepcion. Lo que se
      # mide es que el servidor responde: cualquier codigo por debajo de 500 vale.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request, urllib.error
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/mcp", timeout=4)
          except urllib.error.HTTPError as exc:
              sys.exit(1 if exc.code >= 500 else 0)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    memswap_limit: 256m
    networks: [puente, lab]
    logging: *default-logging

  # ---------------------------------------------------------------- google

  # Correo por IMAP (contrasena de aplicacion) y calendario por la URL secreta
  # iCal, solo lectura. Nada de OAuth: ver google-mcp/app/server.py.
  # Solo en la red puente: necesita salir a Gmail y a Google, y la red lab es
  # interna y sin salida. Los secretos, solo en este contenedor.
  google-mcp:
    build:
      context: ./google-mcp
    image: puente/google-mcp:dev
    container_name: puente-google-mcp
    restart: unless-stopped
    environment:
      GMAIL_USUARIO: ${GMAIL_USUARIO:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GOOGLE_ICAL_URLS: ${GOOGLE_ICAL_URLS:-}
      ZONA_HORARIA: ${ZONA_HORARIA:-Europe/Madrid}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    # En localhost, como homelab-mcp, para que Claude Code use el mismo servidor.
    ports:
      - "127.0.0.1:${GOOGLE_MCP_PORT:-8422}:8000"
    healthcheck:
      # Solo que el servidor responde: la salud de Gmail no es la de este proceso.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request, urllib.error
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/mcp", timeout=4)
          except urllib.error.HTTPError as exc:
              sys.exit(1 if exc.code >= 500 else 0)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 15s
    # ~48 MiB en reposo. El margen es para parsear un correo de 1 MB o un .ics grande.
    mem_limit: 192m
    memswap_limit: 192m
    networks: [puente]
    logging: *default-logging

  # ---------------------------------------------------------------- avisos

  # ntfy propio: el briefing lleva asuntos de correos y no sale del tailnet.
  # Nada de ntfy.sh. Todo cerrado por defecto (deny-all): el agente publica en
  # el topic briefing con un token que solo escribe, y el movil se suscribe con
  # otro que solo lee. Usuarios, permisos y tokens se aprovisionan en cada
  # arranque desde .env, asi que la base de auth vive en un tmpfs y no hay
  # volumen que cuidar. La web de ntfy, apagada: el movil usa la app, que entra
  # con el token (usuario vacio) o como edu con su contrasena (README).
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: puente-ntfy
    restart: unless-stopped
    command: ["serve"]
    user: "1000:1000"
    environment:
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_BEHIND_PROXY: "true"
      # Para el iPhone: iOS no deja a la app una conexion abierta, asi que sin
      # esto las notificaciones de un ntfy propio tardan horas. A ntfy.sh solo
      # va el id del mensaje y el SHA256 de la URL del topic (comprobado): ntfy.sh
      # despierta la app por APNs y el iPhone se baja el contenido de AQUI, por
      # el tailnet. El briefing no sale de casa, que era el motivo de todo esto.
      NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"
      # Con upstream ntfy no arranca sin base-url, y tiene que ser EXACTAMENTE
      # la URL que se pone en las apps: el SHA256 sale de ella.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
      NTFY_WEB_ROOT: disable
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # Los hashes bcrypt vienen de .env, entre comillas simples: sin ellas
      # Compose toma los $ del hash por variables y lo corta sin avisar. Si
      # alguna vez se escriben aqui directamente, cada $ va doble ($$).
      NTFY_AUTH_USERS: "puente:${NTFY_PASS_HASH_PUENTE:?define NTFY_PASS_HASH_PUENTE en .env (ver .env.example)}:user,edu:${NTFY_PASS_HASH_EDU:?define NTFY_PASS_HASH_EDU en .env (ver .env.example)}:user"
      # briefing: el aviso de cada manana. aprobaciones: los botones de las
      # escrituras. puente solo escribe, edu solo lee, en los dos.
      NTFY_AUTH_ACCESS: "puente:briefing:wo,puente:aprobaciones:wo,edu:briefing:ro,edu:aprobaciones:ro"
      NTFY_AUTH_TOKENS: "puente:${NTFY_TOKEN_PUBLICAR:?define NTFY_TOKEN_PUBLICAR en .env (ver .env.example)}:agente,edu:${NTFY_TOKEN_SUSCRIBIR:?define NTFY_TOKEN_SUSCRIBIR en .env (ver .env.example)}:movil"
    read_only: true
    tmpfs:
      - /var/lib/ntfy:size=8m,mode=1777
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    # Solo localhost; al tailnet lo saca tailscale serve (README).
    ports:
      - "127.0.0.1:${NTFY_PORT:-8423}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/v1/health | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    memswap_limit: 64m
    networks: [puente]
    logging: *default-logging

volumes:
  pg-data:
  redis-data:

networks:
  puente:
    name: puente
    driver: bridge
  # Sin salida a ninguna parte: el socket-proxy no necesita internet y no lo
  # tiene. Solo lo alcanza homelab-mcp, que esta en las dos redes.
  lab:
    name: puente-lab
    driver: bridge
    internal: true
