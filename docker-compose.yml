name: puente

# Regla no negociable de este proyecto: TODO contenedor lleva mem_limit.
# Este host sirve APIArena en produccion. Sin limites, un bucle del agente
# que se hincha hace que el OOM killer del kernel elija victima por heuristica,
# y puede llevarse apiarena-postgres por delante.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    image: postgres:16-alpine
    container_name: puente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-puente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-puente}
    command: >-
      postgres
      -c shared_buffers=256MB
      -c max_connections=40
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-puente} -d ${POSTGRES_DB:-puente}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    memswap_limit: 512m
    networks: [puente]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: puente-redis
    restart: unless-stopped
    command: >-
      redis-server
      --save 60 1000
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 96m
    memswap_limit: 96m
    networks: [puente]
    logging: *default-logging

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: puente-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # la cache de respuestas vive en redis
      redis:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?define ANTHROPIC_API_KEY en .env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?define LITELLM_MASTER_KEY en .env}
      # Base propia (db/init/02_litellm_db.sql). Sin ella max_budget no se aplica.
      # connection_limit acota el pool de Prisma, que por defecto es 2*CPU+1 y
      # con 12 hilos agotaria el max_connections=40 de postgres.
      DATABASE_URL: postgresql://${POSTGRES_USER:-puente}:${POSTGRES_PASSWORD}@postgres:5432/litellm?connection_limit=5
      LITELLM_LOG: ${LITELLM_LOG:-ERROR}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Solo en localhost del host: nadie llega aqui salvo por el tailnet.
    ports:
      - "127.0.0.1:4141:4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    # Medido (LiteLLM 1.100.1, con DATABASE_URL): ~820 MiB en reposo y pico de
    # ~1,29 GiB al arrancar, mientras Prisma migra. Con 384m moria por OOM antes
    # de terminar de importar. 1536m = pico + ~20%.
    mem_limit: 1536m
    memswap_limit: 1536m
    networks: [puente]
    logging: *default-logging

  agent:
    build:
      context: ./agent
    image: puente/agent:dev
    container_name: puente-agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-puente}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-puente}
      REDIS_URL: redis://redis:6379/0
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      SMART_MODEL: ${SMART_MODEL:-smart}
      FAST_MODEL: ${FAST_MODEL:-fast}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      READ_ONLY: ${READ_ONLY:-false}
    # El puerto que expone tailscale serve. Solo localhost.
    ports:
      - "127.0.0.1:${AGENT_PORT:-8420}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)\""]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    memswap_limit: 512m
    networks: [puente]
    logging: *default-logging

  # ---------------------------------------------------------------- homelab

  # El unico contenedor que ve el socket de Docker. Con POST=0 no hay forma de
  # arrancar, parar ni borrar nada por este camino: solo lectura, de verdad.
  # Vive en una red interna sin salida, junto al MCP y con nadie mas.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: puente-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      VERSION: 1
      PING: 1
      # Todo lo demas queda en 0 por defecto. POST explicito para que se lea.
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 48m
    memswap_limit: 48m
    networks: [lab]
    logging: *default-logging

  homelab-mcp:
    build:
      context: ./homelab-mcp
    image: puente/homelab-mcp:dev
    container_name: puente-homelab-mcp
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    environment:
      DOCKER_API: http://docker-socket-proxy:2375
      HOSTFS: /hostfs
      PROC_PATH: /host/proc
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Solo lectura y sin root: solo alcanza lo que ya es legible por todos.
      # Es el patron de node-exporter. De aqui salen memoria, carga y discos.
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /
        target: /hostfs
        read_only: true
        bind:
          # Sin rslave, un bind de / no arrastra los submontajes y statvfs de
          # cualquier particion aparte devolveria los datos de / sin avisar.
          propagation: rslave
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    # Publicado en localhost para que Claude Code en el server use el mismo
    # servidor MCP que el agente. Una integracion, dos clientes.
    ports:
      - "127.0.0.1:${MCP_PORT:-8421}:8000"
    healthcheck:
      # Un GET a /mcp sin cabeceras de sesion devuelve 406 por diseno del
      # transporte streamable-http, y urlopen lo lanza como excepcion. Lo que se
      # mide es que el servidor responde: cualquier codigo por debajo de 500 vale.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request, urllib.error
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/mcp", timeout=4)
          except urllib.error.HTTPError as exc:
              sys.exit(1 if exc.code >= 500 else 0)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    memswap_limit: 256m
    networks: [puente, lab]
    logging: *default-logging

volumes:
  pg-data:
  redis-data:

networks:
  puente:
    name: puente
    driver: bridge
  # Sin salida a ninguna parte: el socket-proxy no necesita internet y no lo
  # tiene. Solo lo alcanza homelab-mcp, que esta en las dos redes.
  lab:
    name: puente-lab
    driver: bridge
    internal: true
