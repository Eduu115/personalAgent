<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puente de mando</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icono-192.png">
<meta name="theme-color" content="#0f1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Puente de mando. Una consola de guardia: callada mientras no pase nada, y
   legible desde el otro lado de la habitacion cuando pasa.

   Tres reglas que mandan sobre el resto:
   - Todo el tamano de letra va en rem sobre el tamano base del navegador, para
     que siga al ajuste de texto del sistema. Con px no lo sigue.
   - Nada se dice solo con color: al lado de cada color hay una palabra.
   - El unico sitio con color saturado es lo que reclama algo. Si no reclama
     nada, la pantalla es gris entera, y eso es informacion. */

:root {
  color-scheme: dark;
  /* Superficies e tinta. Contrastes medidos sobre --base y --alza:
     tinta 16.99 / 15.50 · tenue 8.07 / 7.36 · acento 9.09 / 8.29
     ok 10.11 / 9.23 · ojo 11.57 / 10.55 · mal 6.84 / 6.24  (minimo 4.5) */
  --base: #101014;
  --alza: #1a1a20;
  --hueco: #0a0a0d;
  /* La linea que agrupa esta en 2.97:1 sobre la base a proposito: un borde de
     1.2:1 no se ve a tres metros, y agrupar es la mitad del trabajo aqui. */
  --linea: #5e5e6b;
  --pelo: #2a2a33;
  --tinta: #f2f2f5;
  --tenue: #a8a8b4;
  --acento: #8ab4ff;
  --ok: #5fd38d;
  --ojo: #ffbf47;
  --mal: #ff6b6b;
  --tapiz-mal: #2a1416;
  --tapiz-ok: #10241a;

  /* Escala. 1rem = lo que diga el navegador (16 px por defecto), asi que todo
     esto crece con el ajuste del sistema. El cuerpo va a 17 px equivalentes,
     que es el tamano por defecto de iOS; el minimo de la escala es 12.75. */
  --t-xs: 0.8rem;
  --t-s: 0.9375rem;
  --t-m: 1.0625rem;
  --t-l: 1.3125rem;
  --t-xl: 1.75rem;
  --numeros: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;

  --r: 12px;
  --toque: 44px;   /* zona tactil minima: esto se usa con el dedo */
}

/* Apariencia clara para el movil a pleno sol. No hay interruptor dentro de la
   consola: manda el ajuste del sistema, que es donde la gente lo busca.
   Contrastes: tinta 16.19 · tenue 6.34 · acento 5.48 · ok 5.07 · ojo 5.65 · mal 5.23 */
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --base: #f7f7f9; --alza: #ffffff; --hueco: #eeeef2;
    --linea: #8d8d9e; --pelo: #dcdce4;
    --tinta: #1a1a20; --tenue: #5a5a68;
    --acento: #2b5bd7; --ok: #0f7a3d; --ojo: #8a5800; --mal: #c0332b;
    --tapiz-mal: #fdeceb; --tapiz-ok: #eaf6ee;
  }
}

/* Mas contraste cuando el sistema lo pide. */
@media (prefers-contrast: more) {
  :root { --tenue: var(--tinta); --linea: var(--tinta); --pelo: var(--linea); }
}

* { box-sizing: border-box; }

html { font-size: 100%; }   /* el ancla de toda la escala: no tocar */

body {
  margin: 0; min-height: 100vh; background: var(--base); color: var(--tinta);
  font: var(--t-m)/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto auto 1fr;
  padding-top: env(safe-area-inset-top);
  -webkit-text-size-adjust: 100%;
}

/* Foco visible: el portatil es un cliente de esto y sin esto no se puede usar
   con el teclado. Va en :focus-visible para no ensuciar el uso con el dedo. */
:focus-visible {
  outline: 3px solid var(--acento);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ------------------------------------------------------------ cabecera */

header {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid var(--pelo);
}
header h1 {
  font-size: var(--t-s); margin: 0; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--tenue);
}
#reloj { margin-left: auto; color: var(--tenue); font-variant-numeric: tabular-nums; font-family: var(--numeros); }
/* El estado de la conexion lleva palabra, no solo un punto de color. */
#enlace { display: flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--tenue); }
.punto { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
#enlace.mal { color: var(--mal); }

/* ------------------------------------------------------ la linea de guardia */
/* La pieza central. Dice en una frase si algo te reclama, con lo mismo que
   decidiria mandarte un push: asi el silencio de la pantalla y el del movil
   significan lo mismo. Cuando no reclama nada, es gris y lo dice. */

#guardia {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 14px 16px; border-bottom: 1px solid var(--pelo);
  font-size: var(--t-l); line-height: 1.3;
}
#guardia .que { font-weight: 620; }
#guardia .desde { font-size: var(--t-s); color: var(--tenue); font-family: var(--numeros); }
#guardia.calma { color: var(--tenue); }
#guardia.calma .que { font-weight: 500; color: var(--tinta); }
#guardia.reclama { background: var(--tapiz-mal); border-bottom-color: var(--mal); }
#guardia.reclama .que { color: var(--mal); }

/* ------------------------------------------------------------ estructura */

main { display: grid; gap: 12px; padding: 12px; min-height: 0; }
@media (min-width: 60rem) {
  body { height: 100vh; overflow: hidden; }
  main { grid-template-columns: 1.1fr 1fr 1.2fr; }
}
section {
  background: var(--alza); border: 1px solid var(--pelo); border-radius: var(--r);
  display: flex; flex-direction: column; min-height: 0;
}
section > h2, .pestanas {
  font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .07em; color: var(--tenue);
  margin: 0; padding: 12px 14px 8px; display: flex; gap: 8px; align-items: center; font-weight: 600;
}
.cuenta {
  background: var(--hueco); border: 1px solid var(--pelo); border-radius: 999px;
  padding: 1px 9px; color: var(--tinta); font-family: var(--numeros);
}
.cuerpo { overflow-y: auto; padding: 0 14px 14px; flex: 1; min-height: 0; }
.vacio { color: var(--tenue); padding: 18px 2px; font-size: var(--t-s); }

/* ------------------------------------------------------------ aprobaciones */

.ficha {
  border: 1px solid var(--pelo); border-left: 3px solid var(--linea);
  border-radius: var(--r); padding: 12px; margin-bottom: 10px; background: var(--base);
}
.ficha.sensitive { border-left-color: var(--ojo); }
.ficha .nombre { font-weight: 600; }
.ficha .riesgo {
  font-size: var(--t-xs); color: var(--tenue); text-transform: uppercase; letter-spacing: .06em;
}
.ficha .pasa { margin: 8px 0; }
.ficha pre {
  background: var(--hueco); border: 1px solid var(--pelo); border-radius: 8px; padding: 8px;
  margin: 8px 0; font-size: var(--t-s); font-family: var(--numeros);
  white-space: pre-wrap; word-break: break-word; max-height: 12rem; overflow: auto;
}
.queda { color: var(--tenue); font-family: var(--numeros); font-size: var(--t-s); }
.queda.poco { color: var(--ojo); font-weight: 600; }
.botones { display: flex; gap: 8px; margin-top: 10px; }
.resuelta { color: var(--tenue); padding-top: 8px; font-size: var(--t-s); }
.resuelta.fallo { color: var(--ojo); }

/* ------------------------------------------------------------ controles */

button {
  font: inherit; font-size: var(--t-s); border-radius: 10px;
  border: 1px solid var(--linea); background: var(--alza); color: var(--tinta);
  padding: 10px 14px; cursor: pointer; min-height: var(--toque); flex: 1;
}
button:hover:not(:disabled) { background: var(--hueco); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .5; cursor: default; }
button.si { background: var(--tapiz-ok); border-color: var(--ok); }
button.no { background: var(--tapiz-mal); border-color: var(--mal); }

/* Pestanas: son navegacion, asi que se pulsan con el dedo como todo lo demas.
   Antes median 25 px de alto, por debajo del minimo de 28. */
.pestanas { padding-right: 8px; gap: 4px; }
button.pestana {
  flex: 0 0 auto; min-height: var(--toque); padding: 6px 12px; font-size: var(--t-xs);
  text-transform: uppercase; letter-spacing: .07em; font-weight: 600;
  color: var(--tenue); background: none; border-color: transparent; border-radius: 8px;
}
button.pestana.activa { color: var(--tinta); background: var(--hueco); border-color: var(--pelo); }

.panel { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.panel.oculto { display: none; }

/* ------------------------------------------------------------ estado */

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 8px; }
.tile {
  border: 1px solid var(--pelo); border-left: 3px solid var(--linea);
  border-radius: 8px; padding: 8px 10px; background: var(--base);
}
.tile.ok { border-left-color: var(--ok); }
.tile.mal { border-left-color: var(--mal); background: var(--tapiz-mal); }
.tile.ojo { border-left-color: var(--ojo); }
.tile.off { opacity: .6; }
.tile .n { font-size: var(--t-s); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* El estado va escrito, no solo en el color del borde. Antes el detalle vivia
   en un title=, que con el dedo no se ve y un lector de pantalla no lee. */
.tile .e { font-size: var(--t-xs); color: var(--tenue); }
.grupo {
  display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 6px;
  font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .07em; color: var(--tenue); font-weight: 600;
}
.grupo .malos { color: var(--ojo); }
.medidas { margin: 16px 0 6px; }
.barra { height: 10px; background: var(--hueco); border: 1px solid var(--pelo); border-radius: 5px; overflow: hidden; margin: 4px 0 10px; }
.barra > div { height: 100%; background: var(--acento); }
.barra > div.alta { background: var(--ojo); }
.barra > div.critica { background: var(--mal); }
.etiqueta { display: flex; justify-content: space-between; font-size: var(--t-s); color: var(--tenue); gap: 10px; }
.etiqueta b { font-family: var(--numeros); font-weight: 600; color: var(--tinta); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ chat */

#hilo { display: flex; flex-direction: column; gap: 8px; }
.msg { padding: 10px 12px; border-radius: var(--r); max-width: 92%; white-space: pre-wrap; word-wrap: break-word; }
.msg.yo { background: var(--hueco); border: 1px solid var(--pelo); align-self: flex-end; }
.msg.el { background: var(--base); border: 1px solid var(--pelo); align-self: flex-start; }
.evento { font-size: var(--t-s); color: var(--tenue); align-self: flex-start; padding-left: 2px; }
.evento.aviso { color: var(--ojo); }
.evento.error { color: var(--mal); }
form { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--pelo); }
textarea {
  flex: 1; resize: none; font: inherit; background: var(--hueco); color: var(--tinta);
  border: 1px solid var(--linea); border-radius: 10px; padding: 10px;
  min-height: var(--toque); max-height: 8rem;
}
form button { flex: 0 0 auto; }

/* ------------------------------------------------------------ briefing */

.sello { font-size: var(--t-l); font-weight: 620; margin: 4px 0 2px; }
.sello + .desde { color: var(--tenue); font-size: var(--t-s); margin-bottom: 10px; font-family: var(--numeros); }
.resumen { white-space: pre-wrap; word-wrap: break-word; }
.sin-push { color: var(--ojo); font-size: var(--t-s); margin-top: 8px; }
details { border-top: 1px solid var(--pelo); padding: 8px 0; }
details summary { cursor: pointer; color: var(--tenue); font-size: var(--t-s); min-height: var(--toque); display: flex; align-items: center; }
details .resumen { margin-top: 8px; font-size: var(--t-s); color: var(--tenue); }
.pie { padding: 10px 14px 14px; border-top: 1px solid var(--pelo); }
button.generar { background: none; border-style: dashed; color: var(--tenue); width: 100%; }
button.generar.armado { border-style: solid; border-color: var(--ojo); color: var(--ojo); }

/* ------------------------------------------------------------ acciones */

.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 12px; }
button.accion {
  flex: none; min-height: 6.5rem; padding: 16px; font-size: var(--t-m); font-weight: 600;
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left;
}
button.accion .sub { font-size: var(--t-s); font-weight: 400; color: var(--tenue); white-space: normal; }
button.accion.hecho { background: var(--tapiz-ok); border-color: var(--ok); }
button.accion.hecho .sub { color: var(--ok); }
button.accion.fallo { background: var(--tapiz-mal); border-color: var(--mal); }
button.accion.fallo .sub { color: var(--mal); }

/* --------------------------------------------------- barra de pestanas movil */
/* En el movil todo se apilaba en un scroll unico sin forma de saltar: para ver
   una aprobacion habia que pasar por delante del estado entero. */

#barra { display: none; }
@media (max-width: 59.99rem) {
  body { grid-template-rows: auto auto 1fr auto; }
  main > section { display: none; }
  main > section.activa { display: flex; }
  #barra {
    display: grid; grid-auto-flow: column; gap: 4px;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--pelo); background: var(--alza);
    position: sticky; bottom: 0;
  }
  #barra button {
    min-height: var(--toque); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .05em;
    background: none; border-color: transparent; color: var(--tenue); font-weight: 600;
  }
  #barra button.activa { color: var(--acento); background: var(--hueco); border-color: var(--pelo); }
  #barra .aguja { display: block; font-family: var(--numeros); font-size: var(--t-s); color: var(--mal); }
}

/* ------------------------------------------------------------ ambient */

#ambient { display: none; }
body.ambiente header, body.ambiente main, body.ambiente #barra, body.ambiente #guardia { display: none; }
body.ambiente #ambient {
  display: grid; grid-template-rows: auto 1fr auto; gap: 2vh;
  position: fixed; inset: 0; z-index: 20; background: var(--base); padding: 4vh 4vw;
}
.a-cabecera { display: flex; align-items: baseline; justify-content: space-between; color: var(--tenue); font-size: clamp(0.9rem, 2.2vw, 2rem); }
#a-reloj { color: var(--tinta); font-size: clamp(1.4rem, 4vw, 4rem); font-family: var(--numeros); font-variant-numeric: tabular-nums; line-height: 1; }
.a-centro { display: flex; flex-direction: column; justify-content: center; gap: 2.4vh; min-height: 0; overflow: hidden; }
.a-bloque { display: flex; flex-direction: column; gap: .6vh; }
.a-titulo { font-size: clamp(1.4rem, 4.4vw, 4.6rem); font-weight: 650; line-height: 1.1; }
.a-bloque.urgente .a-titulo { color: var(--ojo); }
.a-bloque.roto .a-titulo { color: var(--mal); }
.a-bloque.calma .a-titulo { color: var(--ok); }
.a-detalle { font-size: clamp(0.95rem, 2.4vw, 2.4rem); color: var(--tenue); }
.a-detalle .queda { color: var(--ojo); font-size: inherit; }
.a-pie { display: flex; flex-direction: column; gap: 1vh; }
.a-cifras { display: flex; gap: 6vw; font-size: clamp(0.95rem, 2.6vw, 2.5rem); font-family: var(--numeros); font-variant-numeric: tabular-nums; }
.a-cifras b { font-weight: 650; }
.a-cifras .alta { color: var(--ojo); }
.a-cifras .critica { color: var(--mal); }
.a-briefing { color: var(--tenue); font-size: clamp(0.75rem, 1.9vw, 1.8rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --------------------------------------------------------------- movimiento */
/* El unico movimiento de la consola es el latido de "ejecutando", y ademas
   nunca es lo unico que lo dice: al lado hay una palabra. Con Reduce Motion
   se queda quieto y la palabra sigue estando. */

.resuelta.esperando::after {
  content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 6px;
  border-radius: 50%; background: var(--acento); animation: latido 1.2s ease-in-out infinite;
}
@keyframes latido { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .resuelta.esperando::after { opacity: 1; }
  button:active:not(:disabled) { transform: none; }
}
</style>
</head>
<body>
<header>
  <h1>Puente de mando</h1>
  <!-- El estado del enlace lleva palabra ademas del color: un punto verde o
       rojo de 8 px no dice nada a quien no distingue los dos. -->
  <span id="enlace" role="status"><span class="punto"></span><span id="enlace-texto">Conectando…</span></span>
  <span id="reloj" aria-label="Hora"></span>
</header>

<!-- La linea de guardia: lo que la vigilancia habria avisado, en una frase.
     Si no reclama nada, lo dice y se queda gris. aria-live para que un lector
     de pantalla cante el cambio sin tener que ir a buscarlo. -->
<div id="guardia" class="calma" role="status" aria-live="polite">
  <span class="que">Cargando…</span>
</div>

<main>
  <section id="v-aprobaciones" class="activa" aria-labelledby="t-aprob">
    <h2 id="t-aprob">Aprobaciones <span class="cuenta" id="n-aprob">0</span></h2>
    <div class="cuerpo" id="aprobaciones"><p class="vacio">Cargando…</p></div>
  </section>

  <section id="v-estado" aria-labelledby="t-estado">
    <h2 id="t-estado">Estado <span class="cuenta" id="n-cont">—</span></h2>
    <div class="cuerpo" id="estado"><p class="vacio">Cargando…</p></div>
  </section>

  <section id="v-chat" aria-label="Chat, briefing y acciones">
    <h2 class="pestanas">
      <button class="pestana activa" data-panel="chat">Chat</button>
      <button class="pestana" data-panel="briefing">Briefing</button>
      <button class="pestana" data-panel="acciones">Acciones</button>
    </h2>
    <div class="panel" id="panel-chat">
      <div class="cuerpo" id="hilo"></div>
      <form id="formulario">
        <textarea id="entrada" placeholder="Escribe y pulsa Enter…" rows="1"></textarea>
        <button type="submit" id="enviar">Enviar</button>
      </form>
    </div>
    <div class="panel oculto" id="panel-briefing">
      <div class="cuerpo" id="briefing"><p class="vacio">Cargando…</p></div>
      <div class="pie">
        <!-- El unico boton de la consola que llama al modelo. Dos toques y lo dice. -->
        <button class="generar" id="generar">Generar uno nuevo · llama al modelo</button>
      </div>
    </div>
    <div class="panel oculto" id="panel-acciones">
      <div class="cuerpo" id="acciones"><p class="vacio">Cargando…</p></div>
    </div>
  </section>
</main>

<!-- En pantalla estrecha, las tres columnas se convierten en tres destinos y
     esto es la navegacion. Con el dedo: 44 px de alto y con etiqueta. -->
<nav id="barra" aria-label="Secciones">
  <button data-vista="v-aprobaciones" class="activa">Aprobaciones<span class="aguja" id="aguja-aprob"></span></button>
  <button data-vista="v-estado">Estado<span class="aguja" id="aguja-estado"></span></button>
  <button data-vista="v-chat">Chat</button>
</nav>

<!-- Ambient: tras 3 min sin tocar nada. Solo saca a la superficie lo que te
     reclama, y si no hay nada que reclame lo dice sin ambiguedad. -->
<div id="ambient">
  <div class="a-cabecera"><span id="a-dia"></span><span id="a-reloj"></span></div>
  <div class="a-centro" id="a-centro"></div>
  <div class="a-pie">
    <div class="a-cifras" id="a-cifras"></div>
    <div class="a-briefing" id="a-briefing"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const crear = (etiqueta, clase, texto) => {
  const e = document.createElement(etiqueta);
  if (clase) e.className = clase;
  if (texto !== undefined) e.textContent = texto;   // textContent: nada de HTML de fuera
  return e;
};
function pulso(bien) {
  // Palabra ademas de color: el punto solo no dice nada a quien no distingue
  // el verde del rojo, y esto es lo que avisa de que la pagina se quedo sola.
  $("#enlace").className = bien ? "" : "mal";
  $("#enlace-texto").textContent = bien ? "En línea" : "Sin conexión con el agente";
}

// ---------------------------------------------------------------- aprobaciones
let pendientes = [];
// id -> {texto, clase, ficha}. La fila deja de estar pending en cuanto se
// resuelve, pero su ficha tiene que seguir en pantalla hasta que se sepa como
// acabo: si no, pulsas Aprobar y desaparece sin decir nada.
const resueltas = new Map();

function cuentaAtras(segundos) {
  // Redondear los segundos por separado daba "quedan 1:60" a falta de 119,9 s.
  const total = Math.max(0, Math.round(segundos));
  return `quedan ${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
}

function pintarAprobaciones() {
  const caja = $("#aprobaciones");
  caja.replaceChildren();
  $("#n-aprob").textContent = pendientes.length;
  const vivas = new Set(pendientes.map((p) => p.id));
  const fichas = [...pendientes, ...[...resueltas.values()].filter((r) => !vivas.has(r.ficha.id)).map((r) => r.ficha)];
  if (!fichas.length) {
    caja.append(crear("p", "vacio", "Nada esperando. Todo lo que el agente quiera hacer aparecerá aquí."));
    return;
  }
  for (const p of fichas) {
    const ficha = crear("div", "ficha " + p.riesgo);
    const cabecera = crear("div");
    cabecera.append(crear("span", "nombre", p.herramienta), " ", crear("span", "riesgo", p.riesgo));
    ficha.append(cabecera, crear("div", "pasa", p.que_pasa));
    ficha.append(crear("pre", null, JSON.stringify(p.argumentos, null, 1)));

    if (resueltas.has(p.id)) {
      const estado = resueltas.get(p.id);
      ficha.append(crear("div", "resuelta " + (estado.clase || ""), estado.texto));
    } else {
      const queda = crear("div", "queda");
      queda.dataset.caduca = p.caduca_en;   // la cuenta atras solo mientras espera un OK
      ficha.append(queda);
      const botones = crear("div", "botones");
      for (const [accion, etiqueta, clase] of [["aprobar", "Aprobar", "si"], ["rechazar", "Rechazar", "no"]]) {
        const b = crear("button", clase, etiqueta);
        b.onclick = () => resolver(p, accion, botones);
        botones.append(b);
      }
      ficha.append(botones);
    }
    caja.append(ficha);
  }
  refrescarCuentas();
}

function refrescarCuentas() {
  for (const e of document.querySelectorAll(".queda[data-caduca]")) {
    const segundos = (new Date(e.dataset.caduca) - Date.now()) / 1000;
    e.textContent = segundos > 0 ? cuentaAtras(segundos) : "caducada";
    e.classList.toggle("poco", segundos > 0 && segundos < 120);
  }
}

async function respuestasDe(id) {
  if (!id) return [];
  try {
    const r = await fetch(`/api/conversations/${id}`);
    return (await r.json()).messages.filter((m) => m.role === "assistant");
  } catch (e) {
    return [];
  }
}

// Estados de una ficha: reposo -> enviando -> ejecutando -> resuelto (o sin
// respuesta). El push de ntfy es para cuando NO estas delante; delante de la
// pantalla la respuesta tiene que llegar aqui.
async function resolver(p, accion, botones) {
  for (const b of botones.querySelectorAll("button")) b.disabled = true;
  const boton = botones.querySelector(accion === "aprobar" ? ".si" : ".no");
  boton.textContent = "Enviando…";

  const antes = (await respuestasDe(p.conversation_id)).length;
  let datos = {};
  try {
    const r = await fetch(`/api/aprobaciones/${p.id}/${accion}?n=${encodeURIComponent(p.nonce)}`, { method: "POST" });
    datos = await r.json();
    if (!r.ok) throw new Error(datos.motivo || r.status);
  } catch (e) {
    resueltas.set(p.id, { texto: "No se ha podido: " + e.message, clase: "fallo", ficha: p });
    pintarAprobaciones();
    setTimeout(() => { resueltas.delete(p.id); cargarAprobaciones(); }, 5000);
    return;
  }

  resueltas.set(p.id, {
    texto: accion === "aprobar" ? "Ejecutando y esperando al agente" : "Rechazado; avisando al agente",
    clase: "esperando",
    ficha: p,
  });
  pintarAprobaciones();
  esperarRespuesta(p, accion, antes);
}

async function esperarRespuesta(p, accion, antes) {
  const limite = Date.now() + 120000;   // 2 min y se deja de girar
  while (Date.now() < limite) {
    await new Promise((r) => setTimeout(r, 2000));
    const respuestas = await respuestasDe(p.conversation_id);
    if (respuestas.length > antes) {
      const hecho = accion === "aprobar" ? "aprobado" : "rechazado";
      const otra = p.conversation_id !== conversacion ? " (de otra conversación)" : "";
      evento(`⏸ ${p.herramienta} ${hecho} — el agente responde${otra}:`, "aviso");
      hilo().append(crear("div", "msg el", respuestas[respuestas.length - 1].content));
      alFinal();
      resueltas.delete(p.id);
      cargarAprobaciones();
      cargarEstado();
      return;
    }
  }
  resueltas.set(p.id, {
    texto: "Sin respuesta en 2 minutos. Mira los logs del agente.",
    clase: "fallo",
    ficha: p,
  });
  pintarAprobaciones();
  setTimeout(() => { resueltas.delete(p.id); pintarAprobaciones(); }, 15000);
}

async function cargarAprobaciones() {
  try {
    const r = await fetch("/api/aprobaciones");
    pendientes = (await r.json()).pendientes;
    pulso(true);
  } catch (e) {
    pulso(false);
  }
  pintarAprobaciones();
  pintarGuardia();
  pintarAgujas();
  if (ambiente) pintarAmbient();
}

// ---------------------------------------------------------------- estado
function claseSalud(c) {
  if (c.estado !== "running") return "off";
  if (c.salud === "healthy") return "ok";
  if (c.salud === "unhealthy") return "mal";
  if (c.salud === "starting" || c.detalle?.includes("Restarting")) return "ojo";
  return "";
}

function barra(caja, titulo, usado, total, unidad, pct) {
  const etiqueta = crear("div", "etiqueta");
  etiqueta.append(crear("span", null, titulo), crear("b", null, `${usado} / ${total} ${unidad} · ${pct}%`));
  const barra = crear("div", "barra");
  const relleno = crear("div", pct > 90 ? "critica" : pct > 75 ? "alta" : "");
  relleno.style.width = Math.min(100, pct) + "%";
  barra.append(relleno);
  caja.append(etiqueta, barra);
}

let datosEstado = null;

// ---------------------------------------------------------------- version
// La tablet de la pared es el unico aparato encendido todo el dia y el unico
// que nadie va a recargar nunca: sin esto se queda con la version del dia que
// la colgaste. La version llega en /api/estado, que ya se sondea cada 15 s.
let versionVista = null;

const chatALaVista = () => !$("#panel-chat").classList.contains("oculto");

// Recargar pisando algo a medias es peor que seguir viejo un rato mas: se
// espera al siguiente sondeo, que llega en 15 s.
function ocupado() {
  if ($("#enviar").disabled) return true;            // hay un turno en curso
  if (resueltas.size) return true;                   // una aprobacion ejecutandose
  if (ambiente) return false;                        // en ambient no hay nadie tecleando
  // Que haya conversacion en pantalla ya no frena nada: al recargar se
  // restaura sola. Lo unico que no se puede pisar es lo que aun no se ha
  // enviado, que no esta guardado en ningun sitio.
  return chatALaVista() && !!$("#entrada").value.trim();
}

function mirarVersion(version) {
  if (!version) return;
  if (versionVista === null) { versionVista = version; return; }
  if (version === versionVista || ocupado()) return;
  recargar();
}

async function recargar() {
  // Que el service worker nuevo tome el control ANTES de recargar: si no, la
  // pagina vuelve a cargarse contra el viejo y la recarga no sirve de nada.
  try {
    const registro = await navigator.serviceWorker?.getRegistration();
    if (registro) {
      await registro.update();
      registro.waiting?.postMessage("skipWaiting");
      await new Promise((sigue) => setTimeout(sigue, 500));
    }
  } catch (e) {
    /* sin service worker se recarga igual */
  }
  location.reload();
}

async function cargarEstado() {
  const caja = $("#estado");
  let datos;
  try {
    const r = await fetch("/api/estado");
    datos = await r.json();
    mirarVersion(datos.version);   // tambien viene en el error: un MCP caido no puede dejarla vieja
    if (!r.ok) throw new Error(datos.error || r.status);
    pulso(true);
  } catch (e) {
    pulso(false);
    datosEstado = null;
    caja.replaceChildren(crear("p", "vacio", "No se puede leer el estado: " + e.message));
    if (ambiente) pintarAmbient();
    return;
  }
  datosEstado = datos;
  pintarAgujas();
  if (ambiente) pintarAmbient();
  caja.replaceChildren();
  $("#n-cont").textContent = `${datos.docker.en_marcha}/${datos.docker.contenedores}`;

  // Primero lo que no esta bien, y los del asistente aparte: son los unicos
  // sobre los que puede actuar. Veinte contenedores sanos de APIArena no pueden
  // enterrar al que esta reiniciandose.
  const orden = { mal: 0, ojo: 1, "": 2, ok: 3, off: 4 };
  const gravedad = (a, b) => orden[claseSalud(a)] - orden[claseSalud(b)] || a.nombre.localeCompare(b.nombre);
  const problemas = (grupo) => grupo.filter((c) => ["mal", "ojo"].includes(claseSalud(c))).length;
  const mios = datos.contenedores.filter((c) => c.nombre.startsWith("puente-")).sort(gravedad);
  const resto = datos.contenedores.filter((c) => !c.nombre.startsWith("puente-")).sort(gravedad);
  const grupos = [["Del asistente", mios], ["Lo demás", resto]];
  if (problemas(resto) && !problemas(mios)) grupos.reverse();   // lo roto, arriba

  for (const [titulo, grupo] of grupos) {
    if (!grupo.length) continue;
    const malos = problemas(grupo);
    const cabecera = crear("div", "grupo");
    cabecera.append(crear("span", null, titulo),
                    crear("span", malos ? "malos" : "", malos ? `${malos} con problemas` : `${grupo.length} bien`));
    const tiles = crear("div", "tiles");
    for (const c of grupo.slice(0, 60)) {
      const t = crear("div", "tile " + claseSalud(c));
      // El detalle va escrito. Antes vivia en un title=, que con el dedo no se
      // abre nunca y un lector de pantalla no lo lee.
      t.append(crear("div", "n", c.nombre), crear("div", "e", c.detalle || c.salud || c.estado));
      tiles.append(t);
    }
    caja.append(cabecera, tiles);
    if (grupo.length > 60) caja.append(crear("div", "vacio", `y ${grupo.length - 60} más`));
  }

  const medidas = crear("div", "medidas");
  const m = datos.host.memoria;
  barra(medidas, "RAM", Math.round(m.usado_mib / 1024 * 10) / 10, Math.round(m.total_mib / 1024 * 10) / 10, "GiB", m.usado_pct);
  for (const d of datos.host.discos) {
    barra(medidas, `Disco ${d.punto_montaje}`, Math.round(d.total_gib - d.libre_gib), Math.round(d.total_gib), "GiB", d.usado_pct);
  }
  const carga = datos.host.carga;
  const linea = crear("div", "etiqueta");
  linea.append(crear("span", null, "Carga"), crear("b", null, `${carga.load_1m} · ${carga.carga_por_nucleo_1m}/núcleo`));
  medidas.append(linea);
  caja.append(medidas);
}

// ---------------------------------------------------------------- chat
let conversacion = null;

// El hilo vivia solo en el DOM: una recarga, cerrar la pestana o que se
// bloquee la tablet se lo llevaba, con los mensajes guardados en Postgres
// desde la F0. Al cargar se recupera la ultima conversacion y se pinta.
async function restaurarConversacion() {
  try {
    const r = await fetch("/api/conversations?limit=1");
    const ultima = (await r.json()).conversations?.[0];
    if (!ultima || !ultima.message_count) return;
    const mensajes = (await (await fetch(`/api/conversations/${ultima.id}`)).json()).messages || [];
    if (!mensajes.length) return;
    conversacion = ultima.id;
    hilo().append(crear("div", "evento", `↻ ${ultima.title || "Conversación anterior"} · ${cuando(ultima.updated_at)}`));
    for (const m of mensajes) {
      if (m.role === "user" || m.role === "assistant") {
        hilo().append(crear("div", "msg " + (m.role === "user" ? "yo" : "el"), m.content));
      }
    }
    alFinal();
  } catch (e) {
    // Sin historial se sigue: es una comodidad, no el chat.
  }
}
const hilo = () => $("#hilo");
const alFinal = () => hilo().scrollTop = hilo().scrollHeight;

function evento(texto, clase) {
  hilo().append(crear("div", "evento " + (clase || ""), texto));
  alFinal();
}

async function enviar(texto) {
  hilo().append(crear("div", "msg yo", texto));
  alFinal();
  $("#enviar").disabled = true;
  let burbuja = null;
  const enCurso = new Map();
  try {
    // EventSource solo sabe GET, y esto es un POST: se lee el stream a mano.
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ message: texto, conversation_id: conversacion }),
    });
    const lector = r.body.getReader(), dec = new TextDecoder();
    let buffer = "", corte;
    while (true) {
      const { done, value } = await lector.read();
      if (done) break;
      buffer += dec.decode(value, { stream: true });
      while ((corte = buffer.indexOf("\n\n")) >= 0) {
        const bloque = buffer.slice(0, corte);
        buffer = buffer.slice(corte + 2);
        let nombre = "message", datos = "";
        for (const linea of bloque.split("\n")) {
          if (linea.startsWith("event: ")) nombre = linea.slice(7);
          else if (linea.startsWith("data: ")) datos += linea.slice(6);
        }
        const d = datos ? JSON.parse(datos) : {};
        if (nombre === "start") {
          conversacion = d.conversation_id;
        } else if (nombre === "delta") {
          if (!burbuja) { burbuja = crear("div", "msg el", ""); hilo().append(burbuja); }
          burbuja.textContent += d.text;
          alFinal();
        } else if (nombre === "tool") {
          if (d.estado === "inicio") {
            const e = crear("div", "evento", `⚙ ${d.nombre}…`);
            hilo().append(e); enCurso.set(d.id, e); alFinal();
          } else {
            const e = enCurso.get(d.id) || crear("div", "evento", "");
            const marca = { executed: "✓", failed: "✕", rejected: "⛔", pending: "⏸" }[d.resultado] || "";
            e.textContent = `⚙ ${d.nombre} ${marca} ${d.duracion_ms} ms`;
            if (!e.parentNode) hilo().append(e);
          }
        } else if (nombre === "aprobacion") {
          evento(`⏸ ${d.herramienta} espera tu OK (${d.riesgo}). Mira la columna de la izquierda.`, "aviso");
          cargarAprobaciones();
        } else if (nombre === "bloqueada") {
          evento(`⏸ Hay algo pendiente de aprobar: ${d.herramienta}.`, "aviso");
          cargarAprobaciones();
        } else if (nombre === "limite") {
          evento(`Se cortó tras ${d.rondas} rondas de herramientas.`, "aviso");
        } else if (nombre === "error") {
          evento("Error: " + d.message, "error");
        }
      }
    }
  } catch (e) {
    evento("Se ha cortado: " + e, "error");
  }
  $("#enviar").disabled = false;
  $("#entrada").focus();
}

$("#formulario").onsubmit = (e) => {

// ---------------------------------------------------------------- horas
// La zona la dicen los endpoints (la misma ZONA_HORARIA que usan el agente y
// google-mcp): asi la tablet no pinta otra hora si tiene mal su reloj.
let zona = Intl.DateTimeFormat().resolvedOptions().timeZone;
const hora = (d) => d.toLocaleTimeString("es-ES", { timeZone: zona, hour: "2-digit", minute: "2-digit" });
// sv-SE da "2026-09-27 14:32": ordenable como texto y en la zona que le pidas.
const enZona = (d) => d.toLocaleString("sv-SE", { timeZone: zona });

function cuando(iso) {
  const d = new Date(iso), dia = enZona(d).slice(0, 10);
  const hoy = enZona(new Date()).slice(0, 10);
  const ayer = enZona(new Date(Date.now() - 86400000)).slice(0, 10);
  if (dia === hoy) return `hoy a las ${hora(d)}`;
  if (dia === ayer) return `ayer a las ${hora(d)}`;
  return d.toLocaleDateString("es-ES", { timeZone: zona, weekday: "long", day: "numeric", month: "long" }) + ` a las ${hora(d)}`;
}

function hace(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 2) return "recién";
  if (min < 60) return `hace ${min} min`;
  const h = Math.round(min / 60);
  return h < 48 ? `hace ${h} h` : `hace ${Math.round(h / 24)} días`;
}

function proximoEvento() {
  const eventos = datosAgenda?.eventos || [];   // ya vienen ordenados por hora
  const ahora = enZona(new Date()).slice(0, 16);
  // Las dos cadenas son hora de pared de la misma zona, asi que comparan y
  // restan bien tratandolas como si fueran UTC. Cuenta el que esta pasando
  // ahora, no solo el siguiente: es mas util que el de dentro de cuatro horas.
  const vivo = eventos.find((e) => !e.todo_el_dia && (e.fin || e.inicio) > ahora);
  if (vivo) {
    const min = (Date.parse(vivo.inicio.replace(" ", "T") + "Z") - Date.parse(ahora.replace(" ", "T") + "Z")) / 60000;
    return { texto: `${vivo.inicio.slice(11)} · ${vivo.titulo}`, min, fin: vivo.fin };
  }
  const todoElDia = eventos.find((e) => e.todo_el_dia);
  return todoElDia ? { texto: `Todo el día · ${todoElDia.titulo}`, min: null } : null;
}

// ---------------------------------------------------------------- ambient
const INACTIVIDAD = 180000;   // 3 min
let ambiente = false, inactivo = null, candado = null;

async function pantalla(encendida) {
  // Sin wakeLock (o denegado) el resto funciona igual: solo se apaga la tablet.
  try {
    if (encendida && !candado) candado = await navigator.wakeLock.request("screen");
    else if (!encendida && candado) { await candado.release(); candado = null; }
  } catch (e) {
    candado = null;
  }
}

function entrarAmbient() {
  if (ambiente) return;
  ambiente = true;
  document.body.classList.add("ambiente");
  programar(REFRESCOS.ambient);
  for (const f of REFRESCOS.ambient) f[0]();   // no esperar 30 s a la primera pintada
  pintarAmbient();
  pantalla(true);
}

function salirAmbient() {
  ambiente = false;
  document.body.classList.remove("ambiente");
  programar(REFRESCOS.normal);
  pantalla(false);
}

function despertar() {
  clearTimeout(inactivo);
  inactivo = setTimeout(entrarAmbient, INACTIVIDAD);
  if (ambiente) salirAmbient();
}

function bloque(clase, titulo, detalles) {

}

const titular = (t) => (t.split("\n").map((l) => l.replace(/^[•\-\s]+/, "").trim()).find(Boolean) || "").slice(0, 120);

function pintarAmbient() {
  const centro = $("#a-centro");
  centro.replaceChildren();
  const ahora = new Date();
  $("#a-reloj").textContent = hora(ahora);
  $("#a-dia").textContent = ahora.toLocaleDateString("es-ES", { timeZone: zona, weekday: "long", day: "numeric", month: "long" });

  // 1. Lo que espera un OK. Es lo mas importante que puede salir aqui.
  if (pendientes.length) {
    const detalles = pendientes.slice(0, 3).map((p) => {
      const linea = crear("div", "a-detalle");
      const queda = crear("span", "queda");
      queda.dataset.caduca = p.caduca_en;   // lo actualiza el mismo tick de 1 s que las fichas
      linea.append(crear("span", null, p.herramienta + " · "), queda);
      return linea;
    });
    centro.append(bloque("urgente", pendientes.length === 1
      ? "1 aprobación esperando" : `${pendientes.length} aprobaciones esperando`, detalles));
  }

  // 2. El server, si algo no esta sano. Por nombre.
  const malos = (datosEstado?.contenedores || []).filter((c) => ["mal", "ojo"].includes(claseSalud(c)));
  if (!datosEstado) {
    centro.append(bloque("roto", "No se puede leer el server", ["El MCP del homelab no contesta"]));
  } else if (malos.length) {
    centro.append(bloque("roto", malos.length === 1
      ? `${malos[0].nombre} no está bien` : `${malos.length} contenedores no están bien`,
      [malos.slice(0, 4).map((c) => `${c.nombre} (${c.salud || c.estado})`).join(" · ")]));
  }

  // Si no reclama nada nadie, que se note. Una tablet que siempre parece tener
  // algo que contarte se deja de mirar a la semana.
  if (!centro.children.length) centro.append(bloque("calma", "Todo en orden", []));

  // 3. Lo siguiente de la agenda, con su hora.
  // Nada de rellenar: si hoy no hay nada, no sale ningun bloque de agenda.
  const siguiente = proximoEvento();
  if (siguiente) {
    const detalle = siguiente.min === null ? "Hoy"
      : siguiente.min <= 0 ? `Ahora mismo, hasta las ${siguiente.fin.slice(11)}`
      : siguiente.min < 60 ? `Siguiente en la agenda · en ${Math.round(siguiente.min)} min`
      : `Siguiente en la agenda · en ${Math.round(siguiente.min / 60)} h`;
    centro.append(bloque("", siguiente.texto, [detalle]));
  }

  // 4. Tres numeros del server.
  const cifras = $("#a-cifras");
  cifras.replaceChildren();
  if (datosEstado) {
    const m = datosEstado.host.memoria;
    const discos = datosEstado.host.discos || [];
    const disco = discos.find((x) => x.punto_montaje === "/") || discos[0];
    // Sanos sobre los que estan EN MARCHA, no sobre el total: en el server hay
    // contenedores parados desde hace meses y un "22/41" permanente al lado de
    // "Todo en orden" es justo el ruido que hace que no se mire la tablet.
    const enMarcha = (datosEstado.contenedores || []).filter((c) => c.estado === "running");
    const sanos = enMarcha.filter((c) => !["mal", "ojo"].includes(claseSalud(c))).length;
    for (const [etiqueta, valor, pct] of [
      ["RAM", `${m.usado_pct}%`, m.usado_pct],
      [`Disco ${disco ? disco.punto_montaje : ""}`.trim(), disco ? `${disco.usado_pct}%` : "—", disco?.usado_pct || 0],
      ["Sanos", `${sanos}/${enMarcha.length}`, sanos < enMarcha.length ? 95 : 0],
    ]) {
      const c = crear("div");
      c.append(crear("span", null, etiqueta + " "), crear("b", pct > 90 ? "critica" : pct > 75 ? "alta" : "", valor));
      cifras.append(c);
    }
  }

  // 5. El titular del briefing de hoy.
  const ultimo = losBriefings[0];
  const esDeHoy = ultimo && enZona(new Date(ultimo.creado_en)).slice(0, 10) === enZona(new Date()).slice(0, 10);
  $("#a-briefing").textContent = esDeHoy
    ? `Briefing de las ${hora(new Date(ultimo.creado_en))} · ${titular(ultimo.resumen)}`
    : "Hoy no hay briefing todavía";
  refrescarCuentas();
}

// ---------------------------------------------------------------- acciones
// Se ejecutan al pulsar, sin pasar por la cola: el boton ES la aprobacion (el
// porque, en agent/app/acciones.py). Nada de esto se refresca solo.
let lasAcciones = [], soloLectura = false;

async function cargarAcciones() {
  try {
    const r = await fetch("/api/acciones");
    const d = await r.json();
    lasAcciones = d.acciones || [];
    soloLectura = !!d.read_only;
  } catch (e) {
    lasAcciones = [];
  }
  pintarAcciones();
}

function caraDelBoton(boton, accion, texto, clase) {
  boton.className = "accion " + (clase || "");
  boton.replaceChildren(crear("span", null, accion.etiqueta), crear("span", "sub", texto));
}

function pintarAcciones() {
  const caja = $("#acciones");
  caja.replaceChildren();
  if (!lasAcciones.length) {
    caja.append(crear("p", "vacio", "No hay ninguna acción configurada. Se activan con EQUIPOS_DESPERTABLES en el .env del server."));
    return;
  }
  const rejilla = crear("div", "rejilla");
  for (const accion of lasAcciones) {
    const boton = crear("button");
    caraDelBoton(boton, accion, soloLectura ? "Modo solo lectura: desactivada" : accion.detalle);
    boton.disabled = soloLectura;
    boton.onclick = () => lanzarAccion(accion, boton);
    rejilla.append(boton);
  }
  caja.append(rejilla);
}

async function lanzarAccion(accion, boton) {
  boton.disabled = true;
  caraDelBoton(boton, accion, "Enviando…");
  let d;
  try {
    const r = await fetch("/api/acciones/" + encodeURIComponent(accion.id), { method: "POST" });
    d = await r.json();
  } catch (e) {
    d = { ok: false, error: String(e) };
  }
  // Un paquete WoL no tiene acuse de recibo: lo unico honesto que se puede
  // decir es que salio, y a que hora.
  caraDelBoton(boton, accion,
    d.ok ? `${d.aviso || "Hecho"} · ${hora(new Date())}` : `No ha salido: ${d.error || "?"}`,
    d.ok ? "hecho" : "fallo");
  setTimeout(() => { caraDelBoton(boton, accion, accion.detalle); boton.disabled = soloLectura; }, 15000);
}

// ---------------------------------------------------------------- guardia
// La pieza de arriba. Dice lo MISMO que decidiria mandarte un push, porque lee
// la misma tabla: asi el silencio de la pantalla y el del movil significan lo
// mismo. Si no hay nada que reclame, lo dice y se calla, que es el punto.

let loQueReclama = [];

async function cargarVigilancia() {
  try {
    const r = await fetch("/api/vigilancia");
    loQueReclama = (await r.json()).mal || [];
  } catch (e) {
    loQueReclama = null;   // no es lo mismo "nada reclama" que "no he podido mirar"
  }
  pintarGuardia();
  if (ambiente) pintarAmbient();
}

function pintarGuardia() {
  const caja = $("#guardia");
  caja.replaceChildren();
  const esperando = pendientes.length;

  if (esperando) {
    caja.className = "reclama";
    caja.append(crear("span", "que", esperando === 1
      ? "1 aprobación esperando tu OK" : `${esperando} aprobaciones esperando tu OK`),
      crear("span", "desde", pendientes.map((p) => p.herramienta).join(" · ")));
    return;
  }
  if (loQueReclama === null) {
    caja.className = "calma";
    caja.append(crear("span", "que", "No se puede leer la vigilancia"),
                crear("span", "desde", "el silencio de aquí no significa nada ahora mismo"));
    return;
  }
  if (loQueReclama.length) {
    caja.className = "reclama";
    const [primero, ...resto] = loQueReclama;
    caja.append(crear("span", "que", primero.detalle || primero.nombre),
                crear("span", "desde", `desde ${hace(primero.desde)}` + (resto.length ? ` · y ${resto.length} más` : "")));
    return;
  }
  caja.className = "calma";
  caja.append(crear("span", "que", "Todo en orden"),
              crear("span", "desde", "nada reclama tu atención"));
}

// ------------------------------------------------------- navegacion movil
// En ancho de movil las columnas son destinos, no columnas.
for (const boton of document.querySelectorAll("#barra button")) {
  boton.onclick = () => {
    for (const otro of document.querySelectorAll("#barra button")) otro.classList.toggle("activa", otro === boton);
    for (const vista of document.querySelectorAll("main > section")) {
      vista.classList.toggle("activa", vista.id === boton.dataset.vista);
    }
  };
}

// Una aguja en la pestana cuando hay algo ahi: un numero, no un punto de color.
function pintarAgujas() {
  $("#aguja-aprob").textContent = pendientes.length || "";
  const malos = (datosEstado?.contenedores || []).filter((c) => ["mal", "ojo"].includes(claseSalud(c))).length;
  $("#aguja-estado").textContent = malos || "";
}

// ---------------------------------------------------------------- arranque
// Todo lo que la consola refresca sola. NINGUNA de estas llama al modelo: la
// tablet esta encendida todo el dia y nadie ha pedido nada. Lo comprueba
// app.pruebas en cada despliegue.
const REFRESCOS = {
  normal: [[cargarAprobaciones, 10000], [cargarEstado, 15000], [cargarVigilancia, 20000]],
  ambient: [[cargarAprobaciones, 30000], [cargarEstado, 30000], [cargarAgenda, 30000],
            [cargarBriefings, 30000], [cargarVigilancia, 30000]],
};
let temporizadores = [];
function programar(pares) {
  for (const t of temporizadores) clearInterval(t);
  temporizadores = pares.map(([f, ms]) => setInterval(f, ms));
}

const reloj = () => {
  $("#reloj").textContent = hora(new Date());
  if (ambiente) $("#a-reloj").textContent = hora(new Date());
};
reloj(); setInterval(reloj, 10000);
setInterval(refrescarCuentas, 1000);
programar(REFRESCOS.normal);
cargarAprobaciones();
cargarEstado();
cargarVigilancia();
cargarBriefings();
restaurarConversacion();
cargarAcciones();   // la lista sale del .env: no cambia sola, se pide una vez
for (const ev of ["pointerdown", "keydown", "wheel", "touchstart"]) addEventListener(ev, despertar, { passive: true });
// El sistema suelta el wakeLock al ocultar la pagina; si seguimos en ambient, se vuelve a pedir.
document.addEventListener("visibilitychange", () => { if (ambiente && document.visibilityState === "visible") pantalla(true); });
despertar();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
